name: Publicar analisis en Facebook

# Publica automaticamente, dos veces al dia, una tarjeta con el analisis
# tecnico (precio, RSI, tendencia y mini-grafico) de una criptomoneda
# distinta en la pagina de Facebook de InvestPanel. Los datos se obtienen
# del propio endpoint /api/analysis del sitio, la tarjeta se dibuja con
# sharp (scripts/render-card.mjs) y se publica como foto via la Graph API
# de Facebook con el Page Access Token guardado como secreto del
# repositorio (FB_PAGE_ACCESS_TOKEN).

on:
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch: {}

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencia para dibujar la tarjeta (sharp)
        run: npm install sharp --no-save

      - name: Publicar en la pagina de Facebook
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: "1361643533693650"
        run: node scripts/post-to-facebook.mjs
