name: Publicar Reel en Facebook

# Genera y publica automaticamente, una vez al dia, un Reel corto (15s,
# formato vertical 9:16) con el analisis tecnico de una criptomoneda:
# una tarjeta animada con efecto de zoom lento, hecha con la misma
# informacion que los posts de imagen (precio, RSI, tendencia). El video
# se arma con ffmpeg (se instala en el runner de GitHub con apt-get) y se
# publica en la pagina de Facebook via la Graph API (Reels Publishing
# API), usando el mismo Page Access Token guardado como secreto del
# repositorio (FB_PAGE_ACCESS_TOKEN).

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  publicar-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencia para dibujar la tarjeta (sharp)
        run: npm install sharp --no-save

      - name: Instalar ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Verificar ffmpeg
        run: ffmpeg -version

      - name: Cache del motor de voz (Piper TTS) y la voz en español
        id: cache-piper
        uses: actions/cache@v4
        with:
          path: |
            piper
            piper-voices
          key: piper-tts-es_MX-claude-high-v1

      - name: Descargar Piper TTS (motor de voz, offline y gratuito)
        run: |
          set -e
          mkdir -p piper piper-voices
          if [ ! -x piper/piper ]; then
            curl -sL -o piper.tar.gz https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz
            tar -xzf piper.tar.gz -C piper --strip-components=1
            rm piper.tar.gz
          fi
          if [ ! -s piper-voices/es_MX-claude-high.onnx ]; then
            curl -sL -o piper-voices/es_MX-claude-high.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high/es_MX-claude-high.onnx?download=true"
          fi
          if [ ! -s piper-voices/es_MX-claude-high.onnx.json ]; then
            curl -sL -o piper-voices/es_MX-claude-high.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/es/es_MX/claude/high/es_MX-claude-high.onnx.json?download=true"
          fi
          ls -la piper piper-voices

      - name: Generar y publicar el Reel
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: "1361643533693650"
          PIPER_BIN: ${{ github.workspace }}/piper/piper
          PIPER_MODEL: ${{ github.workspace }}/piper-voices/es_MX-claude-high.onnx
          LD_LIBRARY_PATH: ${{ github.workspace }}/piper
        run: node scripts/post-reel-to-facebook.mjs
